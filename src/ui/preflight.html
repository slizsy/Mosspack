<script type="text/javascript">
/* Mosspack preflight: check the browser before the game loads, and never leave a blank page.
 * Shows a readable message if WebAssembly / WebAssembly GC are missing (JSPI is handled by the loader's own
 * page), if a startup error happens, or if nothing has appeared after 20 seconds. */
(function () {
	"use strict";
	var shown = false;
	function card(title, lines) {
		if (shown) return; shown = true;
		var d = document.createElement("div");
		d.setAttribute("style", "position:fixed;inset:0;z-index:2147483000;background:#12170f;color:#e9eee3;display:flex;align-items:center;justify-content:center;padding:20px;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif");
		var html = '<div style="max-width:640px;background:#1c2417;border:2px solid #34422b;border-radius:8px;box-shadow:0 4px 0 #0b0e09;padding:28px 30px">' +
			'<div style="font:700 22px/1 Menlo,Consolas,monospace;margin-bottom:18px">moss<span style="color:#6fbf4a">pack</span></div>' +
			'<h1 style="font-size:24px;line-height:1.25;margin:0 0 12px">' + title + '</h1>';
		for (var i = 0; i < lines.length; i++) html += '<p style="margin:8px 0;color:#c4ceb9">' + lines[i] + '</p>';
		html += '<p style="margin:18px 0 0;color:#7f8c75;font-size:13px">Browser: ' + (navigator.userAgent || "unknown").replace(/</g, "&lt;") + '</p>' +
			'<button onclick="location.reload()" style="margin-top:18px;background:#6fbf4a;color:#0f140c;border:none;border-radius:4px;padding:11px 18px;font:700 15px/1 inherit;cursor:pointer;box-shadow:inset -3px -3px 0 #3f7a29">Try again</button></div>';
		d.innerHTML = html;
		(document.body || document.documentElement).appendChild(d);
	}
	var update = "Use an up-to-date <b>Chrome</b>, <b>Edge</b> or <b>Brave</b> (version 137 or newer). On a Chromebook: Settings → About ChromeOS → Check for updates.";
	window.__mosspackPreflight = card;

	// 1. WebAssembly + WebAssembly GC (a one-struct module only validates when GC is supported)
	var wasm = typeof WebAssembly === "object" && typeof WebAssembly.validate === "function";
	var gc = false;
	try { gc = wasm && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 127, 0])); } catch (e) {}
	if (!wasm || !gc) {
		document.addEventListener("DOMContentLoaded", function () {
			card("This browser is too old for Mosspack", [
				"Mosspack needs <b>WebAssembly" + (wasm ? " GC" : "") + "</b>, which this browser doesn't support.", update]);
		});
		window.__mosspackBlocked = true;       // the page's load handler skips starting the game
		return;
	}

	// 2. Startup errors become a message instead of a blank page
	function onErr(msg) {
		if (document.querySelector("canvas")) return;           // the game is running; let it handle its own errors
		card("Mosspack couldn't start", ["Something went wrong while loading:", "<code style='color:#cfe8bf'>" + String(msg).replace(/</g, "&lt;").slice(0, 300) + "</code>",
			"Reloading usually fixes it. If it keeps happening, close other tabs (the game needs about 1 GB of memory). " + update]);
	}
	window.addEventListener("error", function (e) { onErr(e.message || e.error || "unknown error"); });
	window.addEventListener("unhandledrejection", function (e) { onErr((e.reason && (e.reason.message || e.reason)) || "unknown error"); });

	// 3. Watchdog: something should be on screen within 20 seconds
	setTimeout(function () {
		var visible = document.querySelector("canvas, iframe, ._eaglercraftX_press_any_key_image, ._eaglercraftX_mobile_press_any_key, ._eaglercraftX_integratedserver_crash_element");
		if (!visible) card("Mosspack is taking too long to start", [
			"Nothing has appeared after 20 seconds. This usually means the browser ran out of memory or is blocking part of the page.",
			"Close other tabs and click Try again. Opening the file from your Downloads folder in Chrome works best (not from inside Google Drive's preview).", update]);
	}, 20000);
})();
</script>
